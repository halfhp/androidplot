name: release androidplot

# Publishes the core library to Maven Central and the demoapp to Google Play.
# Runs when a version tag (e.g. 1.5.11, matching theVersionName) is pushed, or on demand.
on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      publish_maven_central:
        description: Publish the core library to Maven Central
        type: boolean
        default: true
      publish_play:
        description: Publish the demoapp to Google Play
        type: boolean
        default: true

permissions:
  contents: write # needed to attach artifacts to the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the demoapp version code is derived from the commit count

      - name: Verify Tag Matches Project Version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -nE "s/.*theVersionName = '([^']+)'.*/\1/p" build.gradle)
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match theVersionName '$version' in build.gradle"
            exit 1
          fi

      - name: Set Up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Build and Test
        run: ./gradlew testDebugUnitTest :androidplot-core:assembleRelease

      - name: Build Signed Demoapp
        env:
          ENCODED: ${{ secrets.DEMOAPP_KEYSTORE }}
          KEYSTORE: keystore.jks
          KEY_ALIAS: Key0
          KEYSTORE_PASSWORD: ${{ secrets.DEMOAPP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DEMOAPP_KEY_PASSWORD }}
        run: |
          printf '%s' "$ENCODED" | base64 -d > "${GITHUB_WORKSPACE}/demoapp/keystore.jks"
          ./gradlew :demoapp:assembleRelease -Prelease

      # The release body is this version's section of docs/release_notes.md, matching how
      # earlier releases were written up.
      - name: Attach Artifacts to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME}" '
            $0 == "# " v { on = 1; next }
            on && /^# / { exit }
            on { print }
          ' docs/release_notes.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No '# ${GITHUB_REF_NAME}' section found in docs/release_notes.md"
            exit 1
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            androidplot-core/build/outputs/aar/androidplot-core-release.aar \
            demoapp/build/outputs/apk/release/demoapp-release.apk

      # Uploads the signed artifacts to the Central Publisher Portal's
      # OSSRH-compatible staging API, then asks the Portal to validate and
      # release the deployment to Maven Central.
      - name: Publish to Maven Central
        if: github.event_name != 'workflow_dispatch' || inputs.publish_maven_central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          ./gradlew publish
          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')
          status=$(curl -sS -o /tmp/central-release.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.androidplot?publishing_type=automatic")
          cat /tmp/central-release.txt; echo
          if [ "$status" != "200" ]; then
            echo "Central Portal release request failed with HTTP $status"
            exit 1
          fi
          echo "Deployment submitted; track it at https://central.sonatype.com/publishing/deployments"

      # Uploads an APK rather than an app bundle. The demoapp's 2011 signing key
      # is 1024-bit RSA, which Play App Signing does not accept, and bundles
      # require Play App Signing. Play still accepts APKs for existing apps.
      # Betas are published continuously by the build workflow; a tagged release
      # goes to production.
      - name: Publish Demoapp to Google Play (production)
        if: github.event_name != 'workflow_dispatch' || inputs.publish_play
        env:
          KEYSTORE: keystore.jks
          KEY_ALIAS: Key0
          KEYSTORE_PASSWORD: ${{ secrets.DEMOAPP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DEMOAPP_KEY_PASSWORD }}
          PUBLISHER_ACCT_JSON_FILE: publisher.json
          PLAY_JSON: ${{ secrets.PLAY_PUBLISHER_JSON }}
        run: |
          printf '%s' "$PLAY_JSON" > "${GITHUB_WORKSPACE}/demoapp/publisher.json"
          ./gradlew :demoapp:publishReleaseApk -Prelease --track production
