afterEvaluate {
    publishing {
        repositories {
            maven {
                // Central Publisher Portal. Releases go via its OSSRH-compatible
                // staging API and land as a pending deployment that the release
                // workflow then asks the Portal to publish. Snapshots go straight
                // to the Central snapshots repository.
                name = "MavenCentral"
                url = version.endsWith('-SNAPSHOT')
                        ? "https://central.sonatype.com/repository/maven-snapshots/"
                        : "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
                credentials {
                    username = System.getenv("MAVEN_CENTRAL_USERNAME")
                    password = System.getenv("MAVEN_CENTRAL_PASSWORD")
                }
            }
        }

        publications {
            release(MavenPublication) {
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = 'com.androidplot'
                artifactId = 'androidplot-core'
                version = project.version

                pom {
                    packaging = 'aar'
                    name = 'Androidplot'
                    description = "Configure any object from XML."
                    url = gitUrl
                    licenses {
                        license {
                            name = 'The Apache Software License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'halfhp'
                            name = 'Nick Fellows'
                            email = 'halfhp@gmail.com'
                        }
                    }
                    scm {
                        connection = gitUrl
                        developerConnection = gitUrl
                        url = gitUrl
                    }
                }
            }
        }
    }
}

signing {
    def signingKey = System.getenv("SIGNING_KEY")
    def signingPassword = System.getenv("SIGNING_PASSWORD")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign(publishing.publications)
}
