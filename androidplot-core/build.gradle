plugins {
    id 'com.android.library'
    id 'com.mxalbert.gradle.jacoco-android'
    id 'maven-publish'
    id 'signing'
}

abstract class AttrMarkdown extends DefaultTask {

    @InputFile
    File inFile

    @OutputFile
    File outFile

    @TaskAction
    def generate() {
        def input = inFile

        def output = outFile
        if (output.exists()) {
            output.delete()
        }
        output.parentFile.mkdirs()

        input.text.findAll(/<!--\n?([\s\S]*?)\n?-->/) { match, g1 ->
            g1
            if (!g1.startsWith("NODOC")) {
                output.append(g1)
                output.append "\n\n"
            }
        }
    }
}

/**
 * Generates xml attrs markdown docs.  To run:
 * at the command line from the project root dir type:
 * ./gradlew generateAttrsMarkdown
 *
 * The generated doc will appear in / replace androidplot/docs/attrs.md
 */
tasks.register('generateAttrsMarkdown', AttrMarkdown) {
    inFile = file("src/main/res/values/attrs.xml")
    outFile = file("../docs/attrs.md")
}

android {

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    defaultConfig {
        compileSdk rootProject.ext.theCompileSdkVersion
        minSdk rootProject.ext.theMinSdkVersion
        targetSdk rootProject.ext.theTargetSdkVersion
        testApplicationId "com.androidplot.test"
    }

    testOptions {
        // needed so Robolectric can resolve the library's own attrs/styleables from
        // AttributeSets built in tests (see XYPlotAttrsTest etc.)
        unitTests.includeAndroidResources = true
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                jacoco.excludes = ['jdk.internal.*']
            }
        }
    }
    lint {
        abortOnError = false
    }
    namespace = 'com.androidplot'

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

group = 'com.androidplot'
// Pass -Psnapshot to publish a <version>-SNAPSHOT build to the Central snapshots
// repository; without it the exact version is published as a release.
version = rootProject.ext.theVersionName + (project.hasProperty('snapshot') ? '-SNAPSHOT' : '')

def siteUrl = 'http://androidplot.com'
def gitUrl = 'https://github.com/halfhp/androidplot.git'

dependencies {

    implementation 'androidx.annotation:annotation:1.10.0'

    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "org.ow2.asm:asm-tree:9.10.1"
    // Kotlin is only used by KotlinInteropTest; kotlin.stdlib.default.dependency=false in
    // gradle.properties keeps the published POM free of a kotlin-stdlib dependency, and
    // testImplementation never reaches the POM anyway.
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.10"
}

kotlin {
    // match the Java 17 target above (see demoapp/build.gradle)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

