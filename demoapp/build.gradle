plugins {
    id 'com.android.application'
    id 'com.github.triplet.play' version '4.1.1'
}

dependencies {
    // kotlin.stdlib.default.dependency=false is set in gradle.properties so that the pure-java
    // core lib doesn't publish a kotlin-stdlib dependency; declare it explicitly here instead.
    // Version should match the Kotlin compiler bundled with AGP's built-in Kotlin support.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.10"
    implementation "androidx.core:core-ktx:1.19.0"
	implementation project(':androidplot-core')
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}

kotlin {
    jvmToolchain(17)
}

android {

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    compileSdk rootProject.ext.theCompileSdkVersion

    buildFeatures {
        viewBinding = true
    }

    defaultConfig {
        versionCode rootProject.ext.theVersionCode
        versionName rootProject.ext.theVersionName
        minSdk 23
        targetSdk rootProject.ext.theTargetSdkVersion
        applicationId "com.androidplot.demos"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }

        debug {
            debuggable = true
        }
    }
    lint {
        abortOnError = false
    }
    namespace = 'com.androidplot.demos'

}

play {
    // see: https://github.com/Triple-T/gradle-play-publisher
    serviceAccountCredentials.set(file(System.getenv("PUBLISHER_ACCT_JSON_FILE") ?: "publisher.json"))
    track = 'beta'
}
repositories {
    mavenCentral()
}
